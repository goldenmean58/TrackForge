name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package.json (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            runner: macos-latest
            command: npm run package:mac -- --arm64 --publish never
            artifact: trackforge-macos-arm64
            files: |-
              release/*.dmg
              release/*.zip
          - label: macOS Intel
            runner: macos-15-intel
            command: npm run package:mac -- --x64 --publish never
            artifact: trackforge-macos-x64
            files: |-
              release/*.dmg
              release/*.zip
          - label: Windows x64
            runner: windows-latest
            command: npm run package:win -- --x64 --publish never
            artifact: trackforge-windows-x64
            files: release/*.exe
          - label: Linux x64
            runner: ubuntu-latest
            command: npm run package:linux -- --x64 --publish never
            artifact: trackforge-linux-x64
            files: release/*.AppImage

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate release version
        shell: bash
        run: |-
          node -e "const version = require('./package.json').version; const expected = 'v' + version; if (process.env.RELEASE_TAG !== expected) { console.error('Release tag ' + process.env.RELEASE_TAG + ' must equal ' + expected); process.exit(1) }"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Type check
        run: npm run typecheck

      - name: Package application
        run: ${{ matrix.command }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: trackforge-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |-
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: TrackForge ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: release-assets/*
